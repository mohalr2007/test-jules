plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// Load secrets from secrets.properties
def secretsPropertiesFile = rootProject.file("secrets.properties")
def secrets = new Properties()
if (secretsPropertiesFile.exists()) {
    new FileInputStream(secretsPropertiesFile).withCloseable { fis ->
        secrets.load(fis)
    }
}

android {
    namespace 'com.example.sportaicoach'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.sportaicoach"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Get the API key from secrets.properties and make it available in BuildConfig
        buildConfigField "String", "GEMINI_API_KEY", "\"${secrets.getProperty("GEMINI_API_KEY")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Also expose the key to release builds
            buildConfigField "String", "GEMINI_API_KEY", "\"${secrets.getProperty("GEMINI_API_KEY")}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Firebase (BOM - Bill of Materials)
    implementation(platform("com.google.firebase:firebase-bom:34.3.0"))
    // Firebase AI Logic for Gemini
    implementation("com.google.firebase:firebase-ai")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}